apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: jobmatch-llm-security-policy
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-external
  traffic:
    retry:
      attempts: 3
      codes:
        - 503
        - 429
      backoff: 200ms
  backend:
    ai:
      promptGuard:
        request:
          - regex:
              action: Mask
              builtins:
                - Email
                - PhoneNumber
                - Ssn
              matches:
                - ".*github\\.com/.*"
                - ".*linkedin\\.com/.*"
          - regex:
              action: Reject
              matches:
                - "(?i).*ignore previous instructions.*"
                - "(?i).*system prompt.*"
            response:
              message: "The request was rejected due to safety policy violations (Prompt Injection detected)."
        response:
          - regex:
              action: Reject
              matches:
                - "(?i).*ignore previous instructions.*"
                - "(?i).*system prompt.*"
                - "(?i).*only (men|women|male|female).*"
                - "(?i).*under 35.*"
                - "(?i).*old|young*"
            response:
              message: "The response was rejected due to safety policy violations (Prompt Leakage or Discrimination detected)."
      prompt:
        prepend:
          - role: system
            content: "You are a secure Job Matching System. Follow strictly matching rules."
