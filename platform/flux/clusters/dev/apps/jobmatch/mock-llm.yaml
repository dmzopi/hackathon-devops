apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: jobmatch-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-llm
  template:
    metadata:
      labels:
        app: mock-llm
    spec:
      containers:
        - name: mock-llm
          image: node:20-alpine
          command:
            - sh
            - -c
            - |
              node -e '
              const http = require("http");
              
              function extractJsonAfterMarker(dataStr, marker) {
                const markerIndex = dataStr.indexOf(marker);
                if (markerIndex === -1) return null;
                const startIndex = dataStr.indexOf("{", markerIndex);
                if (startIndex === -1) return null;
                let braceCount = 0;
                let inString = false;
                let escape = false;
                for (let i = startIndex; i < dataStr.length; i++) {
                  const char = dataStr[i];
                  if (escape) {
                    escape = false;
                    continue;
                  }
                  if (char === "\\") {
                    escape = true;
                    continue;
                  }
                  if (char === "\"") {
                    inString = !inString;
                    continue;
                  }
                  if (!inString) {
                    if (char === "{") {
                      braceCount++;
                    } else if (char === "}") {
                      braceCount--;
                      if (braceCount === 0) {
                        return dataStr.substring(startIndex, i + 1);
                      }
                    }
                  }
                }
                return null;
              }

              http.createServer((req, res) => {
                let chunks = [];
                req.on("data", chunk => chunks.push(chunk));
                req.on("end", () => {
                  const buffer = Buffer.concat(chunks);
                  const bodyStr = buffer.toString("binary");
                  
                  if (req.url && req.url.includes("/v1/logs")) {
                    const reqBody = extractJsonAfterMarker(bodyStr, "request_body");
                    const resBody = extractJsonAfterMarker(bodyStr, "response_body");
                    
                    if (reqBody || resBody) {
                      let reqFormatted = reqBody || "";
                      let resFormatted = resBody || "";
                      try {
                        if (reqBody) reqFormatted = JSON.stringify(JSON.parse(reqBody), null, 2);
                      } catch (e) {}
                      try {
                        if (resBody) resFormatted = JSON.stringify(JSON.parse(resBody), null, 2);
                      } catch (e) {}
                      
                      console.log("=== RECEIVED MIRRORED REQUEST ===\n" + reqFormatted + "\n====================================");
                      console.log("=== RECEIVED MIRRORED RESPONSE ===\n" + resFormatted + "\n====================================");
                    } else {
                      console.log("=== RECEIVED OTLP LOG RECORD WITHOUT BODIES ===\n" + bodyStr + "\n====================================");
                    }
                    res.writeHead(200, { "Content-Type": "application/json" });
                    res.end(JSON.stringify({ status: "success" }));
                  } else {
                    console.log("=== RECEIVED MASKED REQUEST BODY ===\n" + bodyStr + "\n====================================");
                    res.writeHead(200, { "Content-Type": "application/json" });
                    res.end(JSON.stringify({
                      id: "chatcmpl-mock",
                      object: "chat.completion",
                      created: Math.floor(Date.now() / 1000),
                      model: "mock-model",
                      choices: [
                        {
                          index: 0,
                          message: {
                            role: "assistant",
                            content: JSON.stringify({ score: 5.0, explanation: "Check logs, masking works!", matchedJobs: [] })
                          },
                          finish_reason: "stop"
                        }
                      ],
                      usage: {
                        prompt_tokens: 10,
                        completion_tokens: 10,
                        total_tokens: 20
                      }
                    }));
                  }
                });
              }).listen(8089);
              '
          ports:
            - containerPort: 8089
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: jobmatch-dev
spec:
  ports:
    - port: 8089
      targetPort: 8089
      name: http
  selector:
    app: mock-llm
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-mock-llm
  namespace: jobmatch-dev
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: agentgateway-system
    - group: agentgateway.dev
      kind: AgentgatewayPolicy
      namespace: agentgateway-system
  to:
    - group: ""
      kind: Service
      name: mock-llm

