apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: jobmatch-llm-security-policy
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-external
  traffic:
    retry:
      attempts: 2
      codes:
        - 503
        - 429
        - 401
      backoff: 200ms
    buffer:
      request: {}
      response: {}
  frontend:
    accessLog:
#      attributes:
#        add:
#          - name: request_body
#            expression: "string(request.body)"
#          - name: response_body
#            expression: "string(response.body)"
      otlp:
        backendRef:
          group: ""
          kind: Service
          name: mock-llm
          namespace: jobmatch-prod
          port: 8089
        protocol: HTTP
        path: /v1/logs
  backend:
    ai:
      promptGuard:
        request:
          - regex:
              action: Mask
              builtins:
                - Email
                - PhoneNumber
                - Ssn
              matches:
                - ".*github\\.com/.*"
                - ".*linkedin\\.com/.*"
          - regex:
              action: Reject
              matches:
                - "(?i).*ignore previous instructions.*"
                - "(?i).*system prompt.*"
            response:
              message: "The request was rejected due to safety policy violations (Prompt Injection detected)."
        response:
          - regex:
              action: Reject
              matches:
                - "(?i).*ignore previous instructions.*"
                - "(?i).*system prompt.*"
                - "(?i).*You are a secure Job Matching System.*"
                - "(?i).*only (men|women|male|female).*"
                - "(?i).*under 35.*"
                - "(?i).*\b(old|young)\b.*"
            response:
              message: "The response was rejected due to safety policy violations (Prompt Leakage or Discrimination detected)."
      prompt:
        prepend:
          - role: system
            content: "You are a secure Job Matching System. Follow strictly matching rules."
